# Expected: bundle.path_forbidden, because a listed asset must be under assets/.
# Validation fails first, so the missing payload file is not reported.
apiVersion: craggy.io/bundle/v1

metadata:
  id: invalid.asset-outside
  version: 0.1.0

contributions:
  - id: script
    kind: example.script@1
    path: scripts/a.star
    assets:
      - prompts/review.md
