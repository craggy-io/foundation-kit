# Expected: bundle.asset_missing, because the listed asset doesn't exist.
# Validation fails first, so the missing payload file is not reported.
apiVersion: craggy.io/bundle/v1

metadata:
  id: invalid.asset-missing
  version: 0.1.0

contributions:
  - id: script
    kind: example.script@1
    path: scripts/a.star
    assets:
      - assets/missing.bin
